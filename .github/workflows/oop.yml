name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Task_1_1_1

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Run build script
        run: ./build.sh

      - name: Run tests (JUnit)
        run: |
          javac -cp ".:lib/*" -d build/test-classes src/test/java/ru/nsu/vkuznetsov/Task_1_1_1/SortTest.java
          java -cp ".:lib/*:build/classes:build/test-classes" org.junit.platform.console.ConsoleLauncher --scan-classpath
