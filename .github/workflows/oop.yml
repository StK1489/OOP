name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Task_1_1_1

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Run build script
        run: ./build.sh

      - name: Download JUnit
        run: |
          mkdir -p lib
          wget -q -O lib/junit-platform-console-standalone-1.10.0.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.0/junit-platform-console-standalone-1.10.0.jar

      - name: Compile and run tests
        run: |
          mkdir -p build/test-classes
          javac -cp "build/classes:lib/*" \
                -d build/test-classes \
                src/test/java/ru/nsu/vkuznetsov/Task_1_1_1/SortTest.java
          java -cp "build/classes:build/test-classes:lib/*" \
            org.junit.platform.console.ConsoleLauncher \
            --scan-classpath \
            --include-classname ru.nsu.vkuznetsov.Task_1_1_1.SortTest
